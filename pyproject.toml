# Python is used in two places:
#  1. server/evidence/bridge.py: standard library only, Python >= 3.10.
#     Needed only for the optional search/rerank components.
#  2. scripts/: data pipelines (Python >= 3.12) that regenerate src/data/*.json, plus their tests.
#     The generated JSON is committed, so these are not needed to run the app.
[project]
name = "odyssey-data-pipelines"
version = "1.0.0"
description = "Data acquisition and derivation scripts for ODYSSEY (not needed to run the app)"
requires-python = ">=3.12"
license = "Apache-2.0"

[project.optional-dependencies]
# Versions resolved and tested on 2026-11-14 with Python 3.13 (48 tests pass).
pipelines = [
  "numpy==2.5.4",
  "h3==4.5.0",
  "rasterio==1.5.2",
  "pystac-client==0.9.1",
  "planetary-computer==1.0.0",
  "pyproj==3.8.0",
  "shapely==2.2.0",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "requests==2.34.2",
  "pillow==13.0.0",
]

[tool.uv]
package = false
